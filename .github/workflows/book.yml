name: Book

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use Ghostty binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ghostty
          skipPush: true

      # The book shell supplies mdBook and its preprocessors. The default
      # shell supplies Zig and Rust for mdbook-rustdoc-links' `cargo doc`.
      - name: Build book
        run: nix develop .#book -c nix develop -c mdbook build

      # Vercel's own build image cannot compile the crate, so CI uploads the
      # rendered HTML and Vercel only serves it. Fork PRs get no secrets, and
      # the book is only published from master.
      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: nix develop -c npx --yes vercel@65.17.0 deploy book/html --prod --yes --token "$VERCEL_TOKEN"
