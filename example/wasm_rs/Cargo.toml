[package]
name = "wasm_rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# The smoke test below doubles as an executable Wasm module.
autotests = false

[lib]
crate-type = ["cdylib"]

[[example]]
name = "smoke"
path = "tests/smoke.rs"
crate-type = ["cdylib"]
test = true

[dependencies]
libghostty-vt.workspace = true

[dev-dependencies]
serde_json = "1"
