[package]
name = "libghostty-vt-sys"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "ghostty-vt"
build = "build.rs"

[lib]
doctest = false

[features]
default = []
vendored = ["dep:ureq", "dep:sha2", "dep:flate2", "dep:tar"]
link-dynamic = []
bindgen-tool = ["dep:bindgen", "dep:libc", "dep:heck", "dep:syn", "dep:quote"]
kitty-graphics = []

[dependencies]
bindgen = {version = "0.72.1", optional = true}
libc = {version = "0.2", optional = true}
heck = {version = "0.5", optional = true}
syn = {version = "2", features = ["full"], optional = true}
quote = {version = "1", optional = true}

[build-dependencies]
pkg-config = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]
